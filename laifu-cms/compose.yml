services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: laifu_cms
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d laifu_cms"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - laifu-cms-postgres:/var/lib/postgresql/data

volumes:
  laifu-cms-postgres:
