      <path d="M4 -15 C-6 -16 -12 -22 -10 -29 C0 -28 6 -23 4 -15 Z"/>
      <path d="M8 -27 C16 -33 24 -31 28 -25 C21 -18 12 -19 8 -27 Z"/>
      <path d="M12 -40 C2 -42 -3 -49 0 -56 C10 -54 16 -49 12 -40 Z"/>
      <path d="M16 -53 C24 -60 32 -59 36 -53 C29 -46 21 -46 16 -53 Z"/>
    </g>

    <!-- 两把椅子共用同一轮廓，右椅镜像 -->
    <g id="chair">
      <!-- 椅腿，先画在椅身后方 -->
      <path class="main"
        d="M212 679 L191 757
           Q190 763 198 762
           L226 687 Z"/>
