<svg xmlns="http://www.w3.org/2000/svg"
     width="1672" height="941"
     viewBox="0 0 1672 941">
  <title>一对一会谈室黑白线稿</title>

  <defs>
    <style>
      .main {
        fill: white;
        stroke: black;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .line {
        fill: none;
        stroke: black;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fine {
        fill: none;
        stroke: black;
        stroke-width: 1;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>

    <clipPath id="window-clip">
      <rect x="100" y="0" width="668" height="354"/>
    </clipPath>

    <!-- 叶片与枝条直接组成同一组，避免嵌套 use 缩放后的偏移 -->
